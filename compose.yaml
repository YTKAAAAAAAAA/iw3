services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dispatcher
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-app-role.sql:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatcher"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dispatcher:${APP_DB_PASSWORD}@postgres:5432/dispatcher
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-dispatcher@local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-InternationalAtWork/1.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - app_egress
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  database:
    internal: true
  app_egress:

volumes:
  postgres_data:
