name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Tests, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  migrations:
    name: Migrations on a fresh database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispatcher
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dispatcher
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dispatcher -d dispatcher"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://dispatcher:ci-only-password@localhost:5432/dispatcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Twice: the second run must find nothing to apply.
      - run: node scripts/migrate.mjs
      - run: node scripts/migrate.mjs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag dispatcher:ci .
